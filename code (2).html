<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>文字冒险转盘</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  #app { width: 100%; max-width: 480px; padding: 16px; }
  h1 { text-align: center; margin: 0 0 8px; font-size: 1.6rem; color: #f7c548; }
  .subtitle { text-align: center; color: #aaa; font-size: 0.9rem; margin-bottom: 12px; }
  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 12px;
    background: #e94560;
    color: #fff;
    margin-bottom: 6px;
  }
  .tag.setting { background: #0f3460; }
  #wheelTitle { font-size: 1.2rem; margin: 0 0 4px; line-height: 1.4; }
  #wheelWrap {
    display: flex;
    justify-content: center;
    margin: 12px 0;
    position: relative;
  }
  canvas {
    display: block;
    max-width: 100%;
    height: auto;
    touch-action: manipulation;
  }
  .pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 20px solid #f7c548;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
    z-index: 10;
  }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: #e94560;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 4px 0 #9c1d3d;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #9c1d3d; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary { background: #0f3460; box-shadow: 0 4px 0 #0a2240; }
  #resultArea {
    min-height: 80px;
    background: #0f3460;
    border-radius: 12px;
    padding: 12px;
    margin-top: 8px;
  }
  #resultTitle { font-weight: 700; color: #f7c548; margin-bottom: 6px; font-size: 1.05rem; }
  #resultText { line-height: 1.5; white-space: pre-wrap; }
  #log {
    max-height: 220px;
    overflow: auto;
    background: #0f3460;
    border-radius: 12px;
    padding: 12px;
  }
  .logItem { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #2a2a4a; font-size: 0.9rem; }
  .logItem:last-child { border: none; margin: 0; padding: 0; }
  .logTitle { color: #f7c548; font-weight: 700; }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #16213e;
    border-radius: 16px;
    padding: 24px;
    max-width: 320px;
    width: 90%;
    text-align: center;
  }
  .modal h2 { margin-top: 0; }
  .modal p { color: #aaa; }
</style>
</head>
<body>
<!---->
<div id="app">
  <h1>文字冒险转盘</h1>
  <div class="subtitle">点击转盘或下方按钮转动</div>
<!---->
  <div class="card">
    <span id="wheelTag" class="tag setting">设定</span>
    <h2 id="wheelTitle">载入中...</h2>
<!---->
    <div id="wheelWrap">
      <div class="pointer"></div>
      <canvas id="wheel"></canvas>
    </div>
<!---->
    <button id="spinBtn" class="btn">转动轮盘</button>
    <button id="continueBtn" class="btn secondary" style="display:none;">继续</button>
<!---->
    <div id="resultArea" style="display:none;">
      <div id="resultTitle"></div>
      <div id="resultText"></div>
    </div>
  </div>
<!---->
  <div class="card">
    <h3 style="margin:0 0 8px;">冒险记录</h3>
    <div id="log"></div>
    <button id="resetBtn" class="btn secondary" style="margin-top:12px;">重新开始</button>
  </div>
</div>
<!---->
<div id="resumeOverlay" class="overlay hidden">
  <div class="modal">
    <h2>发现存档</h2>
    <p>要继续上次的冒险吗？</p>
    <button id="resumeBtn" class="btn" style="margin-bottom:10px;">继续游戏</button>
    <button id="newGameOverlayBtn" class="btn secondary">重新开始</button>
  </div>
</div>
<!---->
<script>
// ====================== 1. 在这里自定义你的轮盘内容 ======================
<!---->
// 分支轮盘库：任何选项里写 branchTo: '机遇A' 就会进入这里
const BRANCH_WHEELS = {
  '机遇A': {
    title: '（机遇轮盘 A：获得什么提升）',
    options: [
      { label: '空欢喜', text: '（无事发生，回归主线）' },
      { label: '能力提升', text: '（某项能力 +1）' },
      { label: '关键线索', text: '（获得推进剧情的线索）' }
    ]
  },
  '机遇B': {
    title: '（机遇轮盘 B：遭遇事件）',
    options: [
      { label: '安全通过', text: '（什么也没发生）' },
      { label: '突发战斗', text: '（进入战斗分支）', branchTo: '战斗分支' },
      { label: '神秘商人', text: '（可交易道具）' }
    ]
  },
  '战斗分支': {
    title: '（战斗分支：结果如何）',
    options: [
      { label: '大胜', text: '（战胜并缴获战利品）' },
      { label: '惨胜', text: '（胜利但受伤）' },
      { label: '撤退', text: '（逃离战斗，回归主线）' }
    ]
  },
  '特殊判定A': {
    title: '（特殊判定 A：能否识破）',
    options: [
      { label: '成功', text: '（识破阴谋，获得先机）' },
      { label: '失败', text: '（被蒙在鼓里，回归主线）' }
    ]
  },
  '隐藏机遇': {
    title: '（隐藏机遇：稀有奖励）',
    options: [
      { label: '普通', text: '（获得少量奖励）' },
      { label: '稀有', text: '（获得稀有道具/能力）' }
    ]
  }
};
<!---->
// 主线轮盘：共 20 个
const MAIN_WHEELS = [];
<!---->
// 前 5 个：纯抽设定，建议不写 branchTo
MAIN_WHEELS.push(
  {
    title: '（1. 请填写世界观/初始场景设定）',
    setting: true,
    options: [
      { label: '奇幻大陆', text: '（请填写该设定下的描述）' },
      { label: '科幻星舰', text: '（请填写该设定下的描述）' },
      { label: '现代都市', text: '（请填写该设定下的描述）' },
      { label: '末日废土', text: '（请填写该设定下的描述）' }
    ]
  },
  {
    title: '（2. 请填写主角出身/身份设定）',
    setting: true,
    options: [
      { label: '落魄贵族', text: '（描述）' },
      { label: '流浪孤儿', text: '（描述）' },
      { label: '学院学徒', text: '（描述）' },
      { label: '边境佣兵', text: '（描述）' }
    ]
  },
  {
    title: '（3. 请填写主角初始天赋）',
    setting: true,
    options: [
      { label: '力量', text: '（描述）' },
      { label: '智慧', text: '（描述）' },
      { label: '魅力', text: '（描述）' },
      { label: '敏捷', text: '（描述）' }
    ]
  },
  {
    title: '（4. 请填写主角初始道具）',
    setting: true,
    options: [
      { label: '家传武器', text: '（描述）' },
      { label: '神秘药水', text: '（描述）' },
      { label: '古老地图', text: '（描述）' },
      { label: '一袋金币', text: '（描述）' }
    ]
  },
  {
    title: '（5. 请填写开局触发事件）',
    setting: true,
    options: [
      { label: '被迫逃亡', text: '（描述）' },
      { label: '接受使命', text: '（描述）' },
      { label: '偶然发现', text: '（描述）' },
      { label: '卷入阴谋', text: '（描述）' }
    ]
  }
);
<!---->
// 后 15 个：自动生成占位主线节点，从第 8 个开始出现分支
const BRANCH_TRIGGERS = ['机遇A', '机遇B', '特殊判定A', '机遇A', '隐藏机遇'];
for (let i = 6; i <= 20; i++) {
  const count = 3 + (i % 2); // 3 或 4 个选项
  const options = [];
  for (let j = 0; j < count; j++) {
    const ch = String.fromCharCode(65 + j);
    const opt = { label: `选项 ${ch}`, text: `（${i}-${ch} 的结果描述，请填写）` };
    // 从第 8 个主线开始，选项 B 触发分支（可自行改成任意选项）
    if (j === 1 && i >= 8) {
      const bid = BRANCH_TRIGGERS[(i - 8) % BRANCH_TRIGGERS.length];
      if (bid) opt.branchTo = bid;
    }
    options.push(opt);
  }
  MAIN_WHEELS.push({ title: `（${i}. 请填写主线剧情节点）`, options });
}
<!---->
// ====================== 2. 游戏运行逻辑 ======================
<!---->
const COLORS = [
  '#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7',
  '#DDA0DD','#98D8C8','#F7DC6F','#BB8FCE','#85C1E9'
];
<!---->
const SAVE_KEY = 'text_adventure_roulette_v1';
<!---->
let mainIndex = 0;       // 当前主线轮盘索引
let branchStack = [];    // 分支轮盘栈，支持嵌套分支
let gameLog = [];        // 记录
let finished = false;    // 是否通关
let pending = null;      // 当前等待处理的结果
let isSpinning = false;
<!---->
let canvas, ctx, dpr = 1;
let currentAngle = 0;
<!---->
function getCurrent() {
  if (finished || mainIndex >= MAIN_WHEELS.length) return null;
  if (branchStack.length > 0) {
    const top = branchStack[branchStack.length - 1];
    return { mode: 'branch', wheel: BRANCH_WHEELS[top.branchId] };
  }
  return { mode: 'main', wheel: MAIN_WHEELS[mainIndex] };
}
<!---->
function saveGame() {
  const data = { mainIndex, branchStack, gameLog, finished };
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}
<!---->
function loadGame(data) {
  mainIndex = data.mainIndex || 0;
  branchStack = data.branchStack || [];
  gameLog = data.gameLog || [];
  finished = !!data.finished;
}
<!---->
// 绘制转盘
function drawWheel() {
  const current = getCurrent();
  if (!current) {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    return;
  }
  const opts = current.wheel.options;
  const n = opts.length;
  const arc = 2 * Math.PI / n;
<!---->
  const logicalW = canvas.width / dpr;
  const logicalH = canvas.height / dpr;
  const cx = logicalW / 2;
  const cy = logicalH / 2;
  const r = Math.min(cx, cy) - 10;
<!---->
  ctx.clearRect(0, 0, logicalW, logicalH);
<!---->
  for (let i = 0; i < n; i++) {
    const start = currentAngle + i * arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + arc);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#1a1a2e';
    ctx.stroke();
  }
<!---->
  // 写文字
  for (let i = 0; i < n; i++) {
    const mid = currentAngle + i * arc + arc / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const label = opts[i].label;
    const fontSize = Math.max(11, Math.min(18, 160 / n - label.length * 0.8));
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.fillStyle = '#1a1a2e';
    ctx.fillText(label, r * 0.75, 0);
    ctx.restore();
  }
<!---->
  // 中心圆
  ctx.beginPath();
  ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
  ctx.fillStyle = '#16213e';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#e94560';
  ctx.stroke();
}
<!---->
// 计算当前指针指向的索引（指针固定在顶部 -90°）
function computeIndex() {
  const current = getCurrent();
  const n = current.wheel.options.length;
  const arc = 2 * Math.PI / n;
  const pointer = -Math.PI / 2;
  let rel = (pointer - currentAngle) % (2 * Math.PI);
  if (rel < 0) rel += 2 * Math.PI;
  return Math.floor(rel / arc) % n;
}
<!---->
// 旋转动画
function spin() {
  if (isSpinning || finished || pending) return;
  const current = getCurrent();
  if (!current) return;
<!---->
  isSpinning = true;
  updateButtons();
<!---->
  const n = current.wheel.options.length;
  const arc = 2 * Math.PI / n;
  const targetIdx = Math.floor(Math.random() * n);
  const mid = targetIdx * arc + arc / 2;
<!---->
  // 目标角度：让 targetIdx 的中间对准顶部指针
  let targetBase = -Math.PI / 2 - mid;
  targetBase = ((targetBase % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
<!---->
  const curNorm = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  let deltaToTarget = (targetBase - curNorm + 2 * Math.PI) % (2 * Math.PI);
<!---->
  const rotations = 5 + Math.floor(Math.random() * 4); // 5~8 圈
  const targetAngle = currentAngle + rotations * 2 * Math.PI + deltaToTarget;
  const duration = 3000 + Math.random() * 1500;
<!---->
  const start = performance.now();
  const startAngle = currentAngle;
  const total = targetAngle - startAngle;
<!---->
  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    currentAngle = startAngle + total * ease;
    drawWheel();
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      isSpinning = false;
      finishSpin(computeIndex());
    }
  }
  requestAnimationFrame(frame);
}
<!---->
// 转完后的处理
function finishSpin(idx) {
  const current = getCurrent();
  if (!current) return;
<!---->
  const opt = current.wheel.options[idx];
  gameLog.unshift({ title: current.wheel.title, label: opt.label, text: opt.text });
  renderLog();
  saveGame();
<!---->
  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultTitle').textContent = '转中：' + opt.label;
  document.getElementById('resultText').textContent = opt.text || '（无描述）';
<!---->
  if (opt.branchTo) {
    pending = { type: 'enterBranch', branchId: opt.branchTo };
  } else if (current.mode === 'main') {
    pending = { type: 'advanceMain' };
  } else {
    pending = { type: 'returnFromBranch' };
  }
  updateButtons();
}
<!---->
// 点击“继续”后的处理
function doContinue() {
  if (!pending) return;
<!---->
  if (pending.type === 'enterBranch') {
    branchStack.push({ branchId: pending.branchId, returnMainIndex: mainIndex });
    pending = null;
    document.getElementById('resultArea').style.display = 'none';
  } else if (pending.type === 'advanceMain') {
    mainIndex++;
    pending = null;
    document.getElementById('resultArea').style.display = 'none';
    if (mainIndex >= MAIN_WHEELS.length) {
      finished = true;
    }
  } else if (pending.type === 'returnFromBranch') {
    const ctx = branchStack.pop();
    mainIndex = (ctx ? ctx.returnMainIndex : mainIndex) + 1;
    pending = null;
    document.getElementById('resultArea').style.display = 'none';
    if (mainIndex >= MAIN_WHEELS.length) {
      finished = true;
    }
  }
<!---->
  saveGame();
  if (finished) {
    showEnding();
  } else {
    updateUI();
    drawWheel();
  }
}
<!---->
function showEnding() {
  document.getElementById('wheelTag').textContent = '结局';
  document.getElementById('wheelTag').className = 'tag';
  document.getElementById('wheelTitle').textContent = '（请填写最终结局标题）';
  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultTitle').textContent = '冒险结束';
  document.getElementById('resultText').textContent = '（请在这里填写通关/最终结局描述）';
  updateButtons();
  drawWheel();
}
<!---->
function updateUI() {
  const current = getCurrent();
  if (!current) {
    showEnding();
    return;
  }
  document.getElementById('wheelTitle').textContent = current.wheel.title;
<!---->
  const tag = document.getElementById('wheelTag');
  if (current.mode === 'branch') {
    tag.textContent = '分支';
    tag.className = 'tag';
  } else if (current.wheel.setting) {
    tag.textContent = '设定';
    tag.className = 'tag setting';
  } else {
    tag.textContent = '主线';
    tag.className = 'tag';
  }
  updateButtons();
}
<!---->
function updateButtons() {
  const spinBtn = document.getElementById('spinBtn');
  const continueBtn = document.getElementById('continueBtn');
<!---->
  if (finished) {
    spinBtn.style.display = 'none';
    continueBtn.style.display = 'none';
    return;
  }
<!---->
  if (pending) {
    spinBtn.style.display = 'none';
    continueBtn.style.display = 'block';
    if (pending.type === 'enterBranch') {
      const bw = BRANCH_WHEELS[pending.branchId];
      continueBtn.textContent = '进入分支：' + (bw ? bw.title : pending.branchId);
    } else {
      continueBtn.textContent = '继续';
    }
  } else if (isSpinning) {
    spinBtn.style.display = 'block';
    spinBtn.disabled = true;
    continueBtn.style.display = 'none';
  } else {
    spinBtn.style.display = 'block';
    spinBtn.disabled = false;
    spinBtn.textContent = '转动轮盘';
    continueBtn.style.display = 'none';
  }
}
<!---->
function renderLog() {
  const el = document.getElementById('log');
  if (gameLog.length === 0) {
    el.innerHTML = '<div style="color:#888">暂无记录</div>';
    return;
  }
  el.innerHTML = gameLog.map(item => `
    <div class="logItem">
      <div class="logTitle">${escapeHtml(item.title)}</div>
      <div>${escapeHtml(item.label)}：${escapeHtml(item.text || '')}</div>
    </div>
  `).join('');
}
<!---->
function escapeHtml(str) {
  return String(str).replace(/[&
<>

"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function initCanvas() {
  const wrap = document.getElementById('wheelWrap');
  const maxSize = Math.min(wrap.clientWidth, 360);
  const size = Math.max(200, maxSize - 20);
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(size * dpr);
  canvas.height = Math.floor(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawWheel();
}

function startNewGame() {
  mainIndex = 0;
  branchStack = [];
  gameLog = [];
  finished = false;
  pending = null;
  currentAngle = 0;
  saveGame();
  updateUI();
  renderLog();
  initCanvas();
}

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  canvas = document.getElementById('wheel');
  ctx = canvas.getContext('2d');

  document.getElementById('spinBtn').addEventListener('click', spin);
  canvas.addEventListener('click', spin);
  document.getElementById('continueBtn').addEventListener('click', doContinue);
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('确定要重新开始吗？当前进度会清空。')) startNewGame();
  });

  document.getElementById('resumeBtn').addEventListener('click', () => {
    document.getElementById('resumeOverlay').classList.add('hidden');
    updateUI();
    renderLog();
    initCanvas();
  });
  document.getElementById('newGameOverlayBtn').addEventListener('click', () => {
    document.getElementById('resumeOverlay').classList.add('hidden');
    startNewGame();
  });

  window.addEventListener('resize', initCanvas);

  const saved = localStorage.getItem(SAVE_KEY);
  if (saved) {
    try {
      loadGame(JSON.parse(saved));
      document.getElementById('resumeOverlay').classList.remove('hidden');
      updateUI();
      renderLog();
      initCanvas();
    } catch (e) {
      startNewGame();
    }
  } else {
    startNewGame();
  }
});
</script>

</body>
</html>
